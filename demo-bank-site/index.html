<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нур Банк — демо</title>
<style>
:root{--p:#1b3a8a;--p2:#122a66;--a:#f5a524;--bg:#f3f5fa;--t:#18202f;--m:#62708a;--card:#fff;--line:#e2e7f1;--ok:#1a9d6b;--bad:#d9453d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 16px}
.note{background:#fff7e0;border-bottom:1px solid #f0dc9a;padding:6px 16px;text-align:center;font-size:12.5px}
.top{background:var(--p2);color:#cdd6ee;font-size:13px}
.top .wrap{display:flex;gap:18px;align-items:center;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.top .sp{margin-left:auto}
.top a:hover{color:#fff}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(20,40,90,.05)}
.bar{display:flex;align-items:center;gap:18px;padding:12px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--p);margin-right:8px}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),#3a62d6);display:grid;place-items:center;color:var(--a);font-style:normal;font-size:20px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer}
nav a:hover,nav a.on{background:#e9eefb;color:var(--p)}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:#fff;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer;color:var(--t)}
.lang button.on{background:var(--p);color:#fff}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 20px;border-radius:11px;background:var(--a);color:#2a1d00}
.btn:hover{filter:brightness(.95)}
.btn.s{background:#e9eefb;color:var(--p);padding:8px 14px;font-size:14px}
.btn.o{background:none;border:1.5px solid var(--p);color:var(--p)}
/* slider */
.slider{position:relative;margin-top:22px;border-radius:20px;overflow:hidden;height:300px;color:#fff}
.slide{position:absolute;inset:0;padding:40px 48px;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .6s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h1{font-size:clamp(26px,4.2vw,42px);margin:0 0 10px;max-width:640px;line-height:1.15}
.slide p{max-width:520px;margin:0 0 20px;opacity:.92;font-size:17px}
.slide .big{position:absolute;right:48px;bottom:10px;font-size:150px;opacity:.9}
.s0{background:linear-gradient(120deg,#1b3a8a,#3a62d6)}
.s1{background:linear-gradient(120deg,#0f6b55,#22a67b)}
.s2{background:linear-gradient(120deg,#8a2f64,#d45a9a)}
.dots{position:absolute;left:48px;bottom:16px;display:flex;gap:8px}
.dots b{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}
.dots b.on{background:#fff;width:26px;border-radius:6px}
/* quick */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.15s;font-weight:600;font-size:14.5px}
.q:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,40,90,.1)}
.q div{font-size:28px;margin-bottom:4px}
/* sections */
main{padding-bottom:40px}
.sec{margin-top:40px}
.sec h2{font-size:26px;margin:0 0 6px}
.sec .sub{color:var(--m);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 16px;font:inherit;font-size:14.5px;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:0 10px 26px rgba(20,40,90,.1);transform:translateY(-2px)}
.card .ic{width:50px;height:50px;border-radius:14px;background:#e9eefb;display:grid;place-items:center;font-size:26px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0 0 14px;color:var(--m);font-size:14.5px;flex:1}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{background:#fff3d6;color:#7a4e00;border-radius:20px;padding:3px 11px;font-size:13px;font-weight:700}
/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}.slide{padding:28px 22px}.slide .big{font-size:80px;right:16px}.dots{left:22px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel h3{margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--m);font-weight:600;font-size:13px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.calc label{display:grid;gap:4px;font-size:13.5px;color:var(--m);margin-bottom:12px}
.calc input,.calc select{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--t);background:#fff}
.calc .res{background:#e9eefb;border-radius:12px;padding:14px;margin-top:4px}
.calc .res b{display:block;font-size:24px;color:var(--p)}
.calc .res span{font-size:13px;color:var(--m)}
/* branches */
.br{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.br small{color:var(--m)}
.app{background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;border-radius:20px;padding:34px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:40px}
.app h2{margin:0 0 6px}.app p{margin:0;opacity:.85}
footer{background:#0f1c40;color:#a8b4d4;margin-top:50px;padding:36px 0 22px;font-size:14px}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px}
footer h4{color:#fff;margin:0 0 10px}
footer a{display:block;margin:6px 0;cursor:pointer}footer a:hover{color:#fff}
.copy{border-top:1px solid #243566;margin-top:24px;padding-top:16px;text-align:center;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#18202f;color:#fff;padding:12px 20px;border-radius:12px;transition:.3s;z-index:50;font-size:14px}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>

<div class="top"><div class="wrap">

      <div class="res"><span id="rl"></span><b id="rv"></b><span id="rt"></span></div>
    </div>
  </section>

  <section class="sec two" id="contacts">
    <div class="panel"><h3 data-i="h_br"></h3><div id="branches"></div></div>
    <div class="panel"><h3 data-i="h_news"></h3><div id="news"></div></div>
  </section>

  <div class="app"><div><h2 data-i="app_h"></h2><p data-i="app_p"></p></div>
    <button class="btn" data-i="app_b" onclick="toast()"></button></div>
</main>

const $=id=>document.getElementById(id);
let L="ru",tab=0,slide=0,timer;
try{L=localStorage.getItem("lang")||"ru"}catch(e){}
const fmt=n=>Math.round(n).toLocaleString(L==="zh"?"zh-CN":L==="uz"?"uz-UZ":"ru-RU");
function toast(){const t=$("toast");t.textContent=T[L].toastmsg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function go(i){tab=i;render();$("products").scrollIntoView()}
function render(){
 const t=T[L];
 document.documentElement.lang=L;document.title=t.brand+" — demo";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 const sec=["products","products","products","quick","tools","contacts"];
 $("nav").innerHTML=t.nav.map((n,i)=>`<a onclick="${i<3?`go(${i})`:`document.getElementById('${sec[i]}').scrollIntoView()`}">${n}</a>`).join("");
 $("slider").innerHTML=t.slides.map((s,i)=>`<div class="slide s${i} ${i===slide?"on":""}"><h1>${s[0]}</h1><p>${s[1]}</p><div><button class="btn" onclick="toast()">${s[3]}</button></div><div class="big">${s[2]}</div></div>`).join("")+`<div class="dots">${t.slides.map((_,i)=>`<b class="${i===slide?"on":""}" onclick="setSlide(${i})"></b>`).join("")}</div>`;
 $("quick").innerHTML=t.quick.map(q=>`<div class="q" onclick="toast()"><div>${q[0]}</div>${q[1]}</div>`).join("");
 $("tabs").innerHTML=t.tabs.map((n,i)=>`<button class="${i===tab?"on":""}" onclick="tab=${i};render()">${n}</button>`).join("");
 $("grid").innerHTML=t.items[tab].map(c=>`<div class="card"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><div class="row"><span class="tag">${c[3]}</span><button class="btn s" onclick="toast()">${t.more}</button></div></div>`).join("");
 $("branches").innerHTML=t.branches.map(b=>`<div class="br"><div><b>${b[0]}</b><br><small>${b[1]}</small></div><small>${b[2]}</small></div>`).join("");
 $("news").innerHTML=t.news.map(n=>`<div class="br"><span>${n[0]}</span><small>${n[1]}</small></div>`).join("");
 $("fcols").innerHTML=t.foot_cols.map(c=>`<div><h4>${c[0]}</h4>${c[1].map(x=>`<a>${x}</a>`).join("")}</div>`).join("");
 calc();
}
function setSlide(i){slide=i;render();clearInterval(timer);timer=setInterval(()=>setSlide((slide+1)%3),6000)}
function calc(){
 const t=T[L],s=+$("sum").value||0,r=+$("rate").value||0,m=+$("term").value||1,i=r/1200;
 if($("ctype").value==="dep"){
  const inc=s*r/100*m/12;
  $("rl").textContent=t.r_dep;$("rv").textContent=fmt(inc)+" "+t.cur;$("rt").textContent=t.r_tot_dep+fmt(s+inc)+" "+t.cur;
 }else{
  const p=i?s*i/(1-Math.pow(1+i,-m)):s/m;
  $("rl").textContent=t.r_loan;$("rv").textContent=fmt(p)+" "+t.cur;$("rt").textContent=t.r_tot_loan+fmt(p*m-s)+" "+t.cur;
 }
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}render()});
["sum","rate","term","ctype"].forEach(i=>$(i).addEventListener("input",calc));
$("ctype").addEventListener("change",calc);
render();timer=setInterval(()=>setSlide((slide+1)%3),6000);
</script>
