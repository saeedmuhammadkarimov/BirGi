<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нур Банк — демо</title>
<style>
:root{--c:#0b6e4f;--c2:#08543d;--bg:#f5f7f6;--t:#1c2623;--m:#5d6b66;--card:#fff;--line:#e1e7e4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.55}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--c);margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.lang button{border:0;background:none;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;color:var(--t)}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--c);color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border-radius:0;padding:6px 12px}
.lang button.on{background:var(--c);color:#fff}
.hero{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:56px 16px}
.hero div{max-width:1100px;margin:auto}
.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}
.hero p{max-width:560px;opacity:.9;margin:0 0 20px}
.btn{display:inline-block;background:#fff;color:var(--c);padding:10px 20px;border-radius:10px;font-weight:700;border:0;cursor:pointer;font-size:16px}
main{max-width:1100px;margin:auto;padding:28px 16px 60px}
h2{margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0 0 12px;color:var(--m);font-size:15px}
.tag{display:inline-block;background:#e4f3ed;color:var(--c2);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
.ic{font-size:30px;margin-bottom:6px}
.calc{display:grid;gap:12px;max-width:420px}
.calc label{display:grid;gap:4px;font-size:14px;color:var(--m)}
.calc input{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.res{font-size:22px;font-weight:800;color:var(--c)}
footer{background:#13211c;color:#b8c6c0;padding:24px 16px;text-align:center;font-size:14px}
.note{background:#fff8e1;border:1px solid #f0dc9a;padding:8px 16px;text-align:center;font-size:13px}
section{display:none}section.on{display:block}
</style>
</head>
<body>
<div class="note" data-i="note"></div>
<header><div class="bar">
  <div class="logo">🌿 <span data-i="brand"></span></div>
  <nav id="nav"></nav>
  <div class="lang" id="lang">
    <button data-l="ru">RU</button><button data-l="zh">中文</button><button data-l="uz">UZ</button>
  </div>
</div></header>

<div class="hero"><div>
  <h1 data-i="h1"></h1>
  <p data-i="h1p"></p>
  <button class="btn" data-i="cta" onclick="show('cards')"></button>
</div></div>

<main>
  <section id="cards"><h2 data-i="n_cards"></h2><div class="grid" data-list="cards"></div></section>
  <section id="deposits"><h2 data-i="n_deposits"></h2><div class="grid" data-list="deposits"></div></section>
  <section id="loans"><h2 data-i="n_loans"></h2><div class="grid" data-list="loans"></div></section>
  <section id="services"><h2 data-i="n_services"></h2><div class="grid" data-list="services"></div></section>
  <section id="calc"><h2 data-i="n_calc"></h2>
    <div class="card calc">
      <label><span data-i="c_sum"></span><input id="sum" type="number" value="10000000" min="0"></label>
      <label><span data-i="c_rate"></span><input id="rate" type="number" value="18" min="0" step="0.5"></label>
      <label><span data-i="c_term"></span><input id="term" type="number" value="12" min="1"></label>
      <div><span data-i="c_res"></span><div class="res" id="out"></div></div>
    </div>
  </section>
  <section id="contacts"><h2 data-i="n_contacts"></h2>
    <div class="card"><p data-i="addr"></p><p>☎ +998 71 000 00 00</p><p>✉ info@example.com</p></div>
  </section>
</main>
<footer data-i="foot"></footer>

}};
const tabs=["cards","deposits","loans","services","calc","contacts"];
let L=(()=>{try{return localStorage.getItem("lang")}catch(e){}})()||"ru", cur="cards";
function fmt(n){return Math.round(n).toLocaleString(L==="zh"?"zh-CN":L==="uz"?"uz-UZ":"ru-RU")}
function render(){
 const t=T[L];
 document.documentElement.lang=L;document.title=t.brand+" — demo";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 document.querySelectorAll("[data-list]").forEach(g=>{
  g.innerHTML=t[g.dataset.list].map(c=>`<div class="card"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><span class="tag">${c[3]}</span></div>`).join("");
 });
 document.getElementById("nav").innerHTML=tabs.map(k=>`<button class="${k===cur?"on":""}" onclick="show('${k}')">${t["n_"+k]}</button>`).join("");
 document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===cur));
 calc();
}
function show(k){cur=k;render();scrollTo({top:0,behavior:"smooth"})}
function calc(){
 const s=+sum.value||0,r=+rate.value||0,m=+term.value||0;
 out.textContent=fmt(s*r/100*m/12)+" "+T[L].cur;
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}render()});
["sum","rate","term"].forEach(i=>document.getElementById(i).oninput=calc);
render();
</script>
</body>
</html>
